<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Four-runtime Wasm comparison</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="WasmBenchmarkHistory.Wasm.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        // Restore paths redirected through 404.html before Blazor reads the current location.
        var redirect = new URLSearchParams(location.search).get('redirect');
        if (redirect) {
            var basePath = document.querySelector('base').getAttribute('href');
            history.replaceState(null, '', basePath + redirect);
        }
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
